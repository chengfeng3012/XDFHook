org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/34.0.0/aapt2
# 网络说明：不在此文件写死 systemProp 代理。
# 沙箱环境如需代理，用命令行临时指定，例如：
#   ./gradlew -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=7890 \
#            -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7890 <task>
# 写死会让 CI（无本地代理）把所有仓库请求发向不存在的代理，导致构建失败。
